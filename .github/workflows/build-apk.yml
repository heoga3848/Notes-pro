name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Unzip project
        run: |
          unzip -o NotesPro_completo.zip
          ls
      - name: Build Debug APK
        run: |
          PROJECT_DIR=$(ls -d */ | head -n 1)
          echo "Proyecto en $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NotesPro-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
